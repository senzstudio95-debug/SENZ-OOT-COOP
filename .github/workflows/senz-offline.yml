name: Build and publish SENZ Offline 2.8.0
on:
  push:
    paths:
      - 'launcher/v2.8.0/**'
      - '.github/workflows/senz-offline.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Test offline migration with Windows PowerShell 5.1
        shell: powershell
        run: ./launcher/v2.8.0/Test-Offline.ps1
      - name: Download verified previous package and icon
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v2.7.7-exit-beta --repo $env:GITHUB_REPOSITORY --pattern SENZ-Zelda-v2.7.7-BETA-LENGKAP-EXE.zip --output base.zip
          if ($LASTEXITCODE) { throw 'Download failed' }
          python launcher/v2.8.0/package.py
          if ($LASTEXITCODE) { throw 'Base verification failed' }
      - name: Compile new Windows EXE with Zelda icon
        shell: powershell
        run: |
          Push-Location launcher/v2.8.0
          $csc=Join-Path $env:WINDIR Microsoft.NET/Framework64/v4.0.30319/csc.exe
          & $csc /nologo /target:winexe /platform:x64 /reference:System.Windows.Forms.dll /win32icon:zelda.ico /out:SENZ-Zelda.exe Bootstrap.cs
          if ($LASTEXITCODE) { throw 'EXE compilation failed' }
          Pop-Location
      - name: Build and verify full package and update ZIP
        shell: pwsh
        run: |
          python launcher/v2.8.0/package.py
          if ($LASTEXITCODE) { throw 'Packaging failed' }
      - name: WPF startup smoke test on packaged files
        shell: powershell
        run: |
          & powershell.exe -NoProfile -STA -ExecutionPolicy Bypass -File smoke/SENZ-OOT-SOLO/Launcher.ps1 -SmokeTest
          if ($LASTEXITCODE) { throw 'WPF startup failed' }
      - name: Publish verified release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v2.8.0-offline --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --prerelease --title 'SENZ v2.8.0 — Offline sahaja' --notes-file launcher/v2.8.0/BACA-DULU.txt output/SENZ-Update-2.8.0.zip output/SENZ-Zelda-v2.8.0-OFFLINE-LENGKAP-EXE.zip output/SHA256SUMS.txt output/windows.json
          if ($LASTEXITCODE) { throw 'Release failed' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: offline-build-validation
          path: output/*.json
