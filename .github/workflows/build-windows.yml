name: Experimental Fritchii 5.7 Frame Generation
on:
  workflow_dispatch:
  push:
    branches: [codex/fritchii-5.7-framegen]
concurrency:
  group: fritchii-framegen-windows
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          path: patch
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Frizti/Fritchii
          ref: 52317bf0e52a1ece5beb6474689d78c6f2f4894f
          path: engine
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply exact-version source patch
        shell: pwsh
        run: |
          git -C engine apply --check ../patch/framegen-v5.7.patch
          if ($LASTEXITCODE -ne 0) { throw "Patch check failed" }
          git -C engine apply ../patch/framegen-v5.7.patch
          if ($LASTEXITCODE -ne 0) { throw "Patch application failed" }
      - uses: ilammy/msvc-dev-cmd@v1
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: qtcharts
          cache: true
      - name: Install Vulkan SDK
        working-directory: engine
        shell: pwsh
        run: ./tools/windows/install-vulkan-sdk.ps1
      - name: Configure
        working-directory: engine
        shell: pwsh
        run: |
          cmake -S . -B build/release -G Ninja `
            -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF -DYUZU_TESTS=OFF `
            -DYUZU_CMD=ON -DYUZU_ROOM=OFF -DYUZU_ROOM_STANDALONE=OFF `
            -DYUZU_USE_BUNDLED_QT=OFF -DYUZU_USE_BUNDLED_SDL3=ON `
            -DENABLE_LSFG=ON -DENABLE_UPDATE_CHECKER=OFF -DUSE_DISCORD_PRESENCE=OFF
          if ($LASTEXITCODE -ne 0) { throw 'CMake configuration failed' }
      - name: Build Windows binaries
        working-directory: engine
        shell: pwsh
        run: |
          cmake --build build/release --target yuzu yuzu-cmd --parallel 2
          if ($LASTEXITCODE -ne 0) { throw 'Build failed' }
      - name: Deploy Qt runtime
        working-directory: engine
        shell: pwsh
        run: |
          if (-not (Test-Path build/release/bin/lichii.exe)) { throw 'No EXE produced' }
          windeployqt --release --no-translations build/release/bin/lichii.exe
          if ($LASTEXITCODE -ne 0) { throw 'Qt deployment failed' }
          Copy-Item ../patch/BUILD-NOTES.txt build/release/bin/EXPERIMENTAL-FRAMEGEN.txt
          Copy-Item ../patch/framegen-v5.7.patch build/release/bin/framegen-source.patch
          Copy-Item LICENSE.txt build/release/bin/LICENSE-upstream.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Fritchii-v5.7-Internal-FG-Windows
          path: engine/build/release/bin/
          if-no-files-found: error
          retention-days: 7
