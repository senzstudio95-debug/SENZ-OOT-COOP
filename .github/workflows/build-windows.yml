name: Experimental Fritchii 5.7 Frame Generation
on:
  workflow_dispatch:
concurrency:
  group: fritchii-framegen-windows
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 180
    env:
      SCCACHE_DIR: ${{ github.workspace }}/compiler-cache
    steps:
      - uses: actions/checkout@v4
        with:
          path: patch
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Frizti/Fritchii
          ref: 52317bf0e52a1ece5beb6474689d78c6f2f4894f
          path: engine
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply exact-version source patch
        shell: pwsh
        run: |
          git -C engine apply --check ../patch/framegen-v5.7.patch
          if ($LASTEXITCODE -ne 0) { throw "Patch check failed" }
          git -C engine apply ../patch/framegen-v5.7.patch
          if ($LASTEXITCODE -ne 0) { throw "Patch application failed" }
      - uses: ilammy/msvc-dev-cmd@v1
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: qtcharts
          cache: true
      - name: Install Vulkan SDK
        working-directory: engine
        shell: pwsh
        run: ./tools/windows/install-vulkan-sdk.ps1
      - name: Install compiler cache
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'sccache.zip'
          Invoke-WebRequest -OutFile $zip https://github.com/mozilla/sccache/releases/download/v0.19.0/sccache-v0.19.0-x86_64-pc-windows-msvc.zip
          Expand-Archive $zip -DestinationPath (Join-Path $env:RUNNER_TEMP 'sccache')
          $bin = (Get-ChildItem -Recurse -Filter sccache.exe (Join-Path $env:RUNNER_TEMP 'sccache')).DirectoryName
          $bin | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
      - uses: actions/cache/restore@v4
        with:
          path: compiler-cache
          key: fg57-msvc-${{ github.run_id }}
          restore-keys: fg57-msvc-
      - name: Configure
        working-directory: engine
        shell: pwsh
        run: |
          cmake -S . -B build/release -G Ninja `
            -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF -DYUZU_TESTS=OFF `
            -DYUZU_CMD=ON -DYUZU_ROOM=OFF -DYUZU_ROOM_STANDALONE=OFF `
            -DYUZU_USE_BUNDLED_QT=OFF -DYUZU_USE_BUNDLED_SDL3=ON `
            -DENABLE_LSFG=ON -DENABLE_UPDATE_CHECKER=OFF -DUSE_DISCORD_PRESENCE=OFF `
            -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache
          if ($LASTEXITCODE -ne 0) { throw 'CMake configuration failed' }
      - name: Build Windows binaries
        working-directory: engine
        shell: pwsh
        run: |
          cmake --build build/release --target yuzu yuzu-cmd --parallel 4
          if ($LASTEXITCODE -ne 0) { throw 'Build failed' }
      - name: Stop compiler cache
        if: always()
        shell: pwsh
        run: sccache --stop-server
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: compiler-cache
          key: fg57-msvc-${{ github.run_id }}
      - name: Deploy Qt runtime
        working-directory: engine
        shell: pwsh
        run: |
          if (-not (Test-Path build/release/bin/lichii.exe)) { throw 'No EXE produced' }
          windeployqt --release --no-translations build/release/bin/lichii.exe
          if ($LASTEXITCODE -ne 0) { throw 'Qt deployment failed' }
          Copy-Item ../patch/BUILD-NOTES.txt build/release/bin/EXPERIMENTAL-FRAMEGEN.txt
          Copy-Item ../patch/framegen-v5.7.patch build/release/bin/framegen-source.patch
          Copy-Item LICENSE.txt build/release/bin/LICENSE-upstream.txt
      - name: Verify CLI and visible GUI startup
        shell: powershell
        working-directory: engine/build/release/bin
        run: |
          $ErrorActionPreference = 'Stop'
          $cli = New-Object System.Diagnostics.Process
          $cli.StartInfo.FileName = (Resolve-Path ./eden-cli.exe).Path
          $cli.StartInfo.Arguments = '--version'
          $cli.StartInfo.WorkingDirectory = (Get-Location).Path
          $cli.StartInfo.UseShellExecute = $false
          [void]$cli.Start()
          if (-not $cli.WaitForExit(30000)) { $cli.Kill(); throw 'CLI startup timed out' }
          $cliCode = $cli.ExitCode
          Write-Host "Verified CLI process exit: $cliCode"
          if ($cliCode -ne 0) { throw "CLI process failed: $cliCode" }
          $gui = Start-Process -FilePath (Resolve-Path ./lichii.exe).Path -PassThru
          Start-Sleep -Seconds 12
          $gui.Refresh()
          if ($gui.HasExited) { throw "GUI exited prematurely: $($gui.ExitCode)" }
          $report = "GUI title: $($gui.MainWindowTitle)`nGUI window handle: $($gui.MainWindowHandle)`nGUI responding: $($gui.Responding)`nCLI exit: $cliCode"
          Write-Host $report
          $report | Out-File -Encoding utf8 startup-check.txt
          $validWindow = $gui.MainWindowHandle -ne 0 -and $gui.Responding
          [void]$gui.CloseMainWindow()
          if (-not $gui.WaitForExit(10000)) { $gui.Kill() }
          if (-not $validWindow) { throw 'No responsive GUI window detected' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Fritchii-v5.7-Internal-FG-Windows
          path: engine/build/release/bin/
          if-no-files-found: error
          retention-days: 7
